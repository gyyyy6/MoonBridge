[build-system]
# No requirements on purpose. The backend is `moonbridge_build.py` in this
# directory and imports nothing outside the standard library, so a build works
# offline and a user does not have to install a build system before installing
# the bridge.
requires = []
build-backend = "moonbridge_build"
backend-path = ["."]

[project]
name = "moonbridge"
version = "0.1.0"
description = "Python bindings for MoonBit packages, generated by MoonBridge"
requires-python = ">=3.9"

[tool.moonbridge]
# The real description of the build lives in `moonbridge_wheel.json`, which the
# packing script writes: the backend reads one file rather than two, and this
# table exists so a human editing the project knows where to look.
config = "moonbridge_wheel.json"
