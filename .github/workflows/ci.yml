name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The installer only publishes `latest` and `nightly`; versioned tarballs are
# not downloadable, so the toolchain cannot be pinned. Every job prints
# `moon version --all` so a future toolchain bump is visible in the first lines
# of the log. When the compiler or core changes, regenerate src/guest_gen and
# run `moon fmt` with that toolchain before committing.

jobs:
  moonbit:
    name: MoonBit (check / test / fmt, wasm + js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      # Canonical gate, exactly as documented in README / the retrospective.
      - name: Check
        run: moon check --deny-warn

      - name: Test
        run: moon test --deny-warn

      - name: Format
        run: moon fmt --check

      # `moon.mod` sets preferred_target = "wasm", so the three steps above
      # only exercise wasm. Run the same gate on both explicit backends: the
      # generator CLI itself runs on js (the only backend needing no C
      # toolchain) while the generated guest is compiled to wasm. A
      # target-specific regression must not hide behind the default target.
      # These re-run cheaply because the build cache is warm in this job.
      - name: Check (wasm)
        run: moon check --target wasm --deny-warn

      - name: Test (wasm)
        run: moon test --target wasm --deny-warn

      - name: Check (js)
        run: moon check --target js --deny-warn

      - name: Test (js)
        run: moon test --target js --deny-warn

  license:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The charset-normalizer extra keeps encoding detection working on
      # runners that do not ship the `file` command.
      - name: Install REUSE
        run: python -m pip install --disable-pip-version-check "reuse[charset-normalizer]"

      # Every tracked file is declared in REUSE.toml; LICENSES/Apache-2.0.txt
      # carries the license text. Fails on any file without copyright/license
      # information, on a bad SPDX identifier, or on a missing license text.
      - name: Check licensing metadata
        run: reuse lint

  corpus:
    name: Corpus (real .mbti files parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Parses the standard library plus every interface dump published by the
      # modules pinned in corpus/packages.txt, and fails on a single error.
      - name: Parse corpus
        run: bash scripts/corpus.sh all

  stubs:
    name: Stubs (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generated package includes `_wasmtime.py`, which imports the real
      # runtime. Without wasmtime installed, mypy --strict reports
      # `import-not-found` and a `no-any-return` where the runtime's types
      # would have been. Pin the same version the end-to-end job runs against.
      - name: Install type-check dependencies
        run: python -m pip install --disable-pip-version-check mypy wasmtime==50.0.1

      # Generates one .pyi per package from the corpus. `gen.sh all` also runs
      # `mypy --strict` internally; the separate named step below repeats it so
      # the S2 acceptance criterion (zero errors, no `# type: ignore`) is an
      # explicit, independently visible gate rather than a side effect hidden
      # inside a script.
      - name: Generate stubs
        run: bash scripts/gen.sh all

      - name: mypy --strict (generated stubs)
        run: python -m mypy --strict --no-incremental --python-version 3.13 _gen/moonbridge

  end-to-end:
    name: End to end (generated Python calls a real guest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wasmtime
        run: python -m pip install --disable-pip-version-check wasmtime==50.0.1

      # Regenerates the stubs, the callable modules and the guest half from one
      # plan, then drives the generated Python against the compiled guest and
      # runs the 100k-call benchmark over six cases. The benchmark exits
      # non-zero on a leak or on a release the guest could not route, which is
      # the S4 acceptance criterion.
      - name: Generate, run, benchmark
        run: bash scripts/e2e.sh

  spike-wasm-python:
    name: Spike 01 (Python <-> Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build spike module
        working-directory: spikes/01-wasm-python/module
        run: moon build --target wasm --release

      - name: Install wasmtime
        run: python -m pip install --disable-pip-version-check wasmtime==50.0.1

      - name: Run host boundary tests
        working-directory: spikes/01-wasm-python
        run: python bridge_test.py module/_build/wasm/release/build/moonbridge-spike.wasm
